name: ci

# ビルド・テスト・lint と、音声の通しの試験。すべて Linux のランナーで回す。
# macOS 向けの分岐（Core Audio での取得、ソケットの置き場所など）は、ここでは確かめない。
# 利用者の実機で確かめる（prd/06 §6.1）。

on:
  # 文書だけの変更では回さない（秘密の検査は別の workflow で、文書にも回る）
  pull_request:
    paths-ignore: ["**.md", "prd/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "prd/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # lint と通常のビルドに使う版。ランナーの rustup で入れ、外部の toolchain 用 Action は使わない
  RUST_VERSION: 1.100.0

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          cargo --version
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # 接続元を Linux にする場合の、内蔵のマイク取得（cpal + ALSA）
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Clippy (native feature)
        run: cargo clippy --locked --all-targets --features native -- -D warnings

  # 代役のマイク → client → bridge → 仮想マイクの流れで、音が届くことを確かめる。
  # 接続元を Linux にする場合の実機が無いので、その経路（内蔵の取得）もここで通す
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo --version
      # libasound2-plugins: ALSA から PulseAudio へ繋ぐプラグイン（内蔵の取得が通る経路）
      - name: Install PulseAudio and ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pulseaudio pulseaudio-utils libasound2-plugins libasound2-dev
      - name: Build (native feature)
        run: cargo build --locked --features native
      - name: End-to-end (capture command)
        run: ./scripts/e2e-linux.sh target/debug/micmux
      - name: End-to-end (native capture)
        run: E2E_NATIVE=1 ./scripts/e2e-linux.sh target/debug/micmux

  # 同じ試験を PipeWire（pipewire-pulse + WirePlumber）で回す。最近のデスクトップ向けの
  # ディストリビューションは、こちらが既定になっている。
  # ALSA のプラグインが既定デバイスを取り合うので、PulseAudio のジョブとは分ける
  e2e-pipewire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          cargo --version
      # pipewire-alsa: ALSA から PipeWire へ繋ぐプラグイン（内蔵の取得が通る経路）
      - name: Install PipeWire and ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pipewire pipewire-pulse wireplumber pipewire-alsa pulseaudio-utils libasound2-dev
          pipewire --version
      - name: Build (native feature)
        run: cargo build --locked --features native
      - name: End-to-end (capture command)
        run: E2E_SERVER=pipewire ./scripts/e2e-linux.sh target/debug/micmux
      - name: End-to-end (native capture)
        run: E2E_SERVER=pipewire E2E_NATIVE=1 ./scripts/e2e-linux.sh target/debug/micmux

  # Cargo.toml の rust-version でビルドできることを確かめる
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust (rust-version)
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
          cargo --version
      - name: Check
        run: cargo check --locked --all-targets
