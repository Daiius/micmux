name: audit

# 依存関係を、既知の脆弱性（RustSec の勧告）と照合する。
# 依存を変えていなくても新しい勧告は出るので、週に 1 回は回す。

on:
  pull_request:
    paths: [Cargo.lock, Cargo.toml, .github/workflows/audit.yml]
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, .github/workflows/audit.yml]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # 外部の Action に権限を渡さないよう、cargo-audit を crates.io から直接入れる
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Audit
        run: cargo audit
